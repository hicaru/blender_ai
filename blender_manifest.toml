schema_version = "1.0.0"
id = "blender_ai"
version = "0.2.0"
name = "Blender AI"
tagline = "AI agent that builds game-ready 3D assets inside Blender"
maintainer = "hicaru"
type = "add-on"
blender_version_min = "5.2.0"
license = [
  "SPDX:GPL-3.0-or-later",
]
tags = ["3D View", "Modeling"]

[permissions]
network = "Sends chat requests to the configured LLM provider"
files = "Reads images you attach and writes exported assets"

[build]
paths_exclude_pattern = [
  "_work/",
  "tests/",
  "__pycache__/",
  ".rlm/",
  ".git/",
  "*.zip",
  ".gitignore",
  "pyproject.toml",
  ".mypy_cache/",
  ".ruff_cache/",
]
